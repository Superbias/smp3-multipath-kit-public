mixed-port: 7890
mode: rule
log-level: info

proxies:
  - name: SMP3-Sidecar
    type: socks5
    server: 127.0.0.1
    port: 18080
    udp: true

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - SMP3-Sidecar
      - DIRECT

rules:
  # Put this discriminator before broad rules that would route the sidecar
  # endpoint back through Mihomo and create a loop.
  - DOMAIN-SUFFIX,example.invalid,SMP3-Sidecar
  - MATCH,Proxy
