plugins {
    id 'com.android.application'
}

android {
    namespace 'com.superbias.smp3.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.superbias.smp3.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.6.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libsmp3-client.so']
        }
    }

    lint {
        abortOnError true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
